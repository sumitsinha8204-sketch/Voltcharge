name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip -o voltcharge.zip
        if [ -d "voltcharge" ]; then cp -rn voltcharge/* . || true; fi
        if [ -d "voltcharge (1)" ]; then cp -rn "voltcharge (1)"/* . || true; fi
        chmod +x gradlew || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --no-daemon -Dksp.incremental=false
        else
          gradle assembleDebug --no-daemon -Dksp.incremental=false
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: voltcharge-apk
        path: "**/build/outputs/apk/debug/*.apk"

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project
      run: |
        unzip -o voltcharge.zip
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR=$(dirname "$GRADLEW_PATH")
          if [ "$DIR" != "." ]; then
            cp -r "$DIR"/* . 2>/dev/null || true
            cp -r "$DIR"/.* . 2>/dev/null || true
          fi
        fi

    - name: Setup Gradle Wrapper if missing
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi

    - name: Place google-services.json & Fix Gradle syntax
      run: |
        mkdir -p app
        GJSON=$(find . -name "google-services.json" | head -n 1)
        if [ -n "$GJSON" ]; then
          cp "$GJSON" app/google-services.json
        fi
        
        if [ -f "app/build.gradle.kts" ]; then
          sed -i 's/applicationId "com.sumitsinha.voltcharge"/applicationId = "com.sumitsinha.voltcharge"/g' app/build.gradle.kts
        fi
        if [ -f "app/build.gradle" ]; then
          sed -i 's/applicationId "com.sumitsinha.voltcharge"/applicationId = "com.sumitsinha.voltcharge"/g' app/build.gradle
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

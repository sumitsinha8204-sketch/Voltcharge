name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project
      run: |
        if [ -f "voltcharge.zip" ]; then
          unzip -o voltcharge.zip
        fi
        if [ -d "voltcharge" ]; then
          cp -rn voltcharge/* . || true
        fi
        if [ -d "voltcharge (1)" ]; then
          cp -rn "voltcharge (1)"/* . || true
        fi
        chmod +x gradlew || true

    - name: Generate Missing Keystore File
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        if [ -d "app" ]; then
          cp debug.keystore app/
        fi

    - name: Build Debug APK
      run: |
        chmod +x gradlew || true
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --no-daemon -Dksp.incremental=false --no-configuration-cache -x lint -x test
        else
          gradle assembleDebug --no-daemon -Dksp.incremental=false --no-configuration-cache -x lint -x test
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: voltcharge-apk
        path: "**/build/outputs/apk/debug/*.apk"
        

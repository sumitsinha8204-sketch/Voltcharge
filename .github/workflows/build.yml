name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Djava.awt.headless=true -Dkotlin.compiler.execution.strategy=in-process"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project
      run: |
        unzip -o voltcharge.zip
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR=$(dirname "$GRADLEW_PATH")
          if [ "$DIR" != "." ]; then
            cp -r "$DIR"/* . 2>/dev/null || true
            cp -r "$DIR"/.* . 2>/dev/null || true
          fi
        fi

    - name: Setup Gradle Wrapper & Properties
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        echo "org.gradle.jvmargs=-Xmx2048m -Djava.awt.headless=true" >> gradle.properties
        echo "ksp.incremental=false" >> gradle.properties

    - name: Auto-Sync Firebase Package Name & Place JSON
      run: |
        python3 -c '
        import os, json, glob, re

        os.makedirs("app", exist_ok=True)
        target = "app/google-services.json"

        # 1. Find and copy google-services.json
        json_files = glob.glob("**/google-services.json", recursive=True)
        if json_files:
            src = os.path.abspath(json_files[0])
            dst = os.path.abspath(target)
            if src != dst:
                with open(src, "r", encoding="utf-8") as f_in:
                    content = f_in.read()
                with open(dst, "w", encoding="utf-8") as f_out:
                    f_out.write(content)

        # 2. Extract package name from google-services.json
        pkg_name = None
        if os.path.exists(target):
            try:
                with open(target, "r", encoding="utf-8") as f:
                    data = json.load(f)
                    pkg_name = data["client"][0]["client_info"]["android_client_info"]["package_name"]
            except Exception as e:
                print("JSON parsing error:", e)

        print(f"--> Firebase Package Name: {pkg_name}")

        # 3. Replace package name in gradle and manifest files
        if pkg_name:
            for root, _, files in os.walk("."):
                if ".git" in root or "build" in root:
                    continue
                for file in files:
                    if file in ["build.gradle", "build.gradle.kts", "AndroidManifest.xml"]:
                        filepath = os.path.join(root, file)
                        with open(filepath, "r", encoding="utf-8") as f:
                            text = f.read()

                        new_text = re.sub(r"com\.example\.[a-zA-Z0-9_.]*", pkg_name, text)
                        new_text = re.sub(r"(applicationId\s*=?\s*[\"']).*?([\"'])", r"\g<1>" + pkg_name + r"\2", new_text)
                        new_text = re.sub(r"(namespace\s*=?\s*[\"']).*?([\"'])", r"\g<1>" + pkg_name + r"\2", new_text)

                        if new_text != text:
                            with open(filepath, "w", encoding="utf-8") as f:
                                f.write(new_text)

            print("--> Package name synced successfully!")
        '

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project
      run: |
        unzip -o voltcharge.zip
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR=$(dirname "$GRADLEW_PATH")
          if [ "$DIR" != "." ]; then
            cp -r "$DIR"/* . 2>/dev/null || true
            cp -r "$DIR"/.* . 2>/dev/null || true
          fi
        fi

    - name: Setup Gradle Wrapper if missing
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi

    - name: Auto-Sync Firebase Package Name & Fix KSP Flags
      run: |
        cat << 'EOF' > sync.py
        import os, json, glob, re

        target = "app/google-services.json"
        os.makedirs("app", exist_ok=True)
        json_files = glob.glob("**/google-services.json", recursive=True)

        if json_files:
            src_path = os.path.abspath(json_files[0])
            dst_path = os.path.abspath(target)
            if src_path != dst_path:
                with open(src_path, "r", encoding="utf-8") as f_src:
                    data_content = f_src.read()
                with open(dst_path, "w", encoding="utf-8") as f_dst:
                    f_dst.write(data_content)

        pkg_name = None
        if os.path.exists(target):
            try:
                with open(target, "r", encoding="utf-8") as f:
                    data = json.load(f)
                    pkg_name = data["client"][0]["client_info"]["android_client_info"]["package_name"]
            except Exception as e:
                print("Error reading google-services.json:", e)

        print(f"--> Firebase Package Name: {pkg_name}")

        if pkg_name:
            for root, _, files in os.walk("app"):
                for file in files:
                    if file in ["build.gradle", "build.gradle.kts", "AndroidManifest.xml"]:
                        filepath = os.path.join(root, file)
                        with open(filepath, "r", encoding="utf-8") as f:
                            lines = f.readlines()
                        
                        new_lines = []
                        for line in lines:
                            if "applicationId" in line and "=" in line:
                                line = f'        applicationId = "{pkg_name}"\n'
                            elif "applicationId" in line and "=" not in line:
                                line = f'        applicationId "{pkg_name}"\n'
                            elif "namespace" in line and "=" in line:
                                line = f'        namespace = "{pkg_name}"\n'
                            elif "namespace" in line and "=" not in line:
                                line = f'        namespace "{pkg_name}"\n'
                            else:
                                line = re.sub(r'com\.example\.[a-zA-Z0-9_.]*', pkg_name, line)
                            new_lines.append(line)

                        with open(filepath, "w", encoding="utf-8") as f:
                            f.writelines(new_lines)

            print("--> Package name synced successfully!")
        EOF
        python3 sync.py

        # Fix KSP annotation processor issues on CI
        echo "ksp.incremental=false" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        

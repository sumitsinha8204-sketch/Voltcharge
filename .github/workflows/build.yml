name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project
      run: |
        unzip -o voltcharge.zip
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR=$(dirname "$GRADLEW_PATH")
          if [ "$DIR" != "." ]; then
            cp -r "$DIR"/* . 2>/dev/null || true
            cp -r "$DIR"/.* . 2>/dev/null || true
          fi
        fi

    - name: Setup Gradle Wrapper if missing
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi

    - name: Auto-Sync Firebase Package Name & Place JSON
      run: |
        python3 -c '
        import os, json, re, glob

        # 1. Move google-services.json to app/ directory
        json_files = glob.glob("**/google-services.json", recursive=True)
        os.makedirs("app", exist_ok=True)
        target = "app/google-services.json"
        if json_files:
            if os.path.abspath(json_files[0]) != os.path.abspath(target):
                with open(json_files[0], "r") as src, open(target, "w") as dst:
                    dst.write(src.read())

        # 2. Extract real package name from Firebase JSON
        pkg_name = None
        if os.path.exists(target):
            try:
                with open(target) as f:
                    data = json.load(f)
                    pkg_name = data["client"][0]["client_info"]["android_client_info"]["package_name"]
            except Exception as e:
                print("JSON parsing error:", e)

        print(f"--> Detected Firebase Package Name: {pkg_name}")

        # 3. Sync extracted package name into all Gradle & Manifest files
        if pkg_name:
            for root, dirs, files in os.walk("app"):
                for file in files:
                    if file in ["build.gradle", "build.gradle.kts", "AndroidManifest.xml"]:
                        filepath = os.path.join(root, file)
                        with open(filepath, "r") as f:
                            content = f.read()

                        content = re.sub(r"applicationId\s*=?\s*[\"'].*?[\"']", f"applicationId = \"{pkg_name}\"", content)
                        content = re.sub(r"namespace\s*=?\s*[\"'].*?[\"']", f"namespace = \"{pkg_name}\"", content)
                        content = re.sub(r"com\.example\.[a-zA-Z0-9_.]*", pkg_name, content)

                        with open(filepath, "w") as f:
                            f.write(content)
            print("--> Package name successfully synced across all project files!")
        '

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
